<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALBASMA Tours & Travels</title>
    <script>
      (function() {
        var repoName = 'al-basma-travels';
        var pathname = window.location.pathname;
        var subpath = '';
        var idx = pathname.indexOf(repoName);
        if (idx !== -1) {
          subpath = pathname.substring(idx + repoName.length);
        } else {
          subpath = pathname;
        }
        if (subpath.startsWith('/')) {
          subpath = subpath.substring(1);
        }
        var targetUrl = '/' + repoName + '/#/' + subpath + window.location.search;
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="background:#022c22;color:#f8f9fa;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;">
    <div style="text-align:center;max-width:400px;background:#011d17;padding:32px;border-radius:12px;border:1px solid rgba(212,175,55,0.4);">
      <h2 style="color:#d4af37;letter-spacing:2px;font-size:18px;margin:0 0 8px 0;">ALBASMA TOURS &amp; TRAVELS</h2>
      <p style="color:#94a3b8;font-size:14px;margin:0 0 16px 0;">Connecting to your luxury journey...</p>
      <a href="/al-basma-travels/#/" style="color:#d4af37;font-size:13px;text-decoration:none;border-bottom:1px solid #d4af37;">Return to Home</a>
    </div>
  </body>
</html>
